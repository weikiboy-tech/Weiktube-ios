name: iOS build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      unsigned_device_archive:
        description: Build an unsigned device xcarchive (not installable; no IPA export)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic project and complete source membership
        run: |
          python3 scripts/generate-project.py --check
          python3 scripts/validate-project.py
      - name: Exercise media lifecycle, bundled filtering and pinned vendor provenance
        run: |
          node WeiktubeTests/MediaBridgeTests.cjs
          node WeiktubeTests/FilterRuntimeTests.cjs
          node Weiktube/AdBlock/VendorSource/vendor-adblock.mjs --check

  simulator:
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    env:
      SIMULATOR_FAMILY: ${{ matrix.family }}
    runs-on: macos-15
    needs: source-checks
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Record available Apple toolchain
        run: |
          mkdir -p artifacts
          xcodebuild -version | tee artifacts/xcode-version.txt
          xcodebuild -showsdks | tee artifacts/apple-sdks.txt
          plutil -lint Weiktube.xcodeproj/project.pbxproj Weiktube/Info.plist ShareExtension/Info.plist
          python3 scripts/validate-project.py
      - name: Run Foundation-only Swift package tests
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee artifacts/swift-package-tests.log
      - name: Select a compatible simulator for this device family
        id: simulator
        run: python3 scripts/select-simulator.py
      - name: Build app and extension; run XCTest and offline UI tests
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Weiktube.xcodeproj \
            -scheme Weiktube \
            -configuration Debug \
            -destination "$DESTINATION" \
            -destination-timeout 120 \
            -derivedDataPath build/DerivedData \
            -resultBundlePath artifacts/Weiktube-Simulator.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            -skip-testing:WeiktubeTests/LiveYouTubeTests \
            build test 2>&1 | tee artifacts/xcodebuild-simulator.log
      - name: Run Xcode analysis
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Weiktube.xcodeproj \
            -scheme Weiktube \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath artifacts/Weiktube-Analyze.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            analyze 2>&1 | tee artifacts/xcodebuild-analyze.log
      - name: Observe live public YouTube playback on iPhone
        if: matrix.family == 'iPhone' && github.event_name != 'pull_request'
        continue-on-error: true
        id: live_video
        env:
          TEST_RUNNER_WEIKTUBE_LIVE_VIDEO: '1'
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Weiktube.xcodeproj -scheme Weiktube \
            -destination "$DESTINATION" -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO -only-testing:WeiktubeTests/LiveYouTubeTests \
            -resultBundlePath artifacts/Weiktube-LiveYouTube.xcresult \
            2>&1 | tee artifacts/live-youtube.log
          grep -Eq "testPublicVideoThroughAppLinkPlayerAndMiniPlayer.*passed" artifacts/live-youtube.log
      - name: Record live-site outcome separately
        if: always() && matrix.family == 'iPhone'
        env:
          LIVE_RESULT: ${{ steps.live_video.outcome }}
        run: echo "Live YouTube playback on the simulator - $LIVE_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Package the unsigned simulator app if built
        if: always()
        run: |
          app_path="build/DerivedData/Build/Products/Debug-iphonesimulator/Weiktube.app"
          if [ -d "$app_path" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$app_path" artifacts/Weiktube-unsignedSimulator.app.zip
          fi
      - name: Upload unsignedSimulator app and observed test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Weiktube-${{ matrix.family }}-Simulator-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

  device-release-build:
    needs: source-checks
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check the iPhone OS Release build and embedded extension
        run: |
          xcodebuild -quiet -project Weiktube.xcodeproj -scheme Weiktube -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Weiktube.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive
          app=build/Weiktube.xcarchive/Products/Applications/Weiktube.app
          test -x "$app/Weiktube"
          test -x "$app/PlugIns/ShareExtension.appex/ShareExtension"

  unsigned-device-archive:
    if: github.event_name == 'workflow_dispatch' && inputs.unsigned_device_archive
    needs: simulator
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build an unsigned archive for generic iOS
        run: |
          mkdir -p artifacts
          set -o pipefail
          xcodebuild \
            -project Weiktube.xcodeproj \
            -scheme Weiktube \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ArchiveDerivedData \
            -archivePath artifacts/Weiktube-unsignedDevice.xcarchive \
            -resultBundlePath artifacts/Weiktube-UnsignedDevice.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive 2>&1 | tee artifacts/xcodebuild-unsigned-device.log
      - name: Package archive without claiming an installable IPA
        if: success()
        run: |
          ditto -c -k --sequesterRsrc --keepParent artifacts/Weiktube-unsignedDevice.xcarchive artifacts/Weiktube-unsignedDevice.xcarchive.zip
          rm -rf artifacts/Weiktube-unsignedDevice.xcarchive
      - name: Upload unsignedDevice archive and build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Weiktube-unsignedDevice-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
